name: Compilar APK Android (DriveWise)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Gerar APK Nativo Android
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Baixar código do repositório
        uses: actions/checkout@v4

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🟢 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Instalar dependências
        run: npm install

      - name: ⚡ Compilar aplicação Web (Vite)
        run: npm run build

      - name: 🤖 Criar e Sincronizar projeto Android com Capacitor
        run: |
          npx cap add android || true
          npx cap sync android

      - name: 🛠️ Injetar Serviços Nativos em Kotlin e Configurações
        run: |
          mkdir -p android/app/src/main/java/com/drivewise/copiloto/
          cp native-android-guide/DriveWiseAccessibilityService.kt android/app/src/main/java/com/drivewise/copiloto/
          cp native-android-guide/FloatingOverlayService.kt android/app/src/main/java/com/drivewise/copiloto/
          cp native-android-guide/DriveWiseNativePlugin.kt android/app/src/main/java/com/drivewise/copiloto/
          mkdir -p android/app/src/main/res/xml/
          cp native-android-guide/accessibility_service_config.xml android/app/src/main/res/xml/
          node scripts/prepare-android.js

      - name: 🔨 Compilar APK Debug com Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk ./drivewise.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk ./drivewise-copiloto.apk

      - name: 📤 Salvar APK como Artefato no GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: drivewise-android-apk
          path: drivewise.apk
          retention-days: 30

      - name: 🚀 Publicar Versão e APK no GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "DriveWise Copiloto APK (Versão Mais Recente)"
          body: |
            ## 🚀 APK Nativo Android Oficial - DriveWise Copiloto
            Este arquivo `.apk` foi gerado automaticamente pelo GitHub Actions com suporte nativo a:
            - **Sobreposição de tela**: Bolha flutuante em tempo real sobre a Uber e 99.
            - **Leitura automática (Acessibilidade)**: Detecta os ganhos e quilometragem das chamadas no trânsito.
            - **Modo Background**: Alertas em viva-voz e cálculo instantâneo de lucro.

            ### 📲 Como instalar no celular:
            1. Baixe o arquivo **`drivewise.apk`** abaixo.
            2. Toque no arquivo baixado e selecione **Instalar**.
            3. Ao abrir pela primeira vez, ative as permissões de **Sobreposição** e **Acessibilidade**.
          files: |
            drivewise.apk
            drivewise-copiloto.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
