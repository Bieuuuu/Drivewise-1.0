name: Build Android APK (DriveWise)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Gerar APK Nativo Android (Release Assinado)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: |
          npm install --legacy-peer-deps
          npm install react-is --save

      - name: Compilar aplicação Web (Vite)
        run: npm run build

      - name: Sincronizar projeto Android com Capacitor
        run: npx cap sync android

      - name: Gerar ícones nativos DriveWise (Mipmap e Adaptive Icons)
        run: node scripts/generate-android-icons.mjs

      - name: Gerar Keystore Oficial de Release (Assinatura V1 + V2)
        run: |
          if [ ! -f android/app/drivewise-release.keystore ]; then
            keytool -genkeypair -v \
              -keystore android/app/drivewise-release.keystore \
              -alias drivewise \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass drivewise2026 \
              -keypass drivewise2026 \
              -dname "CN=DriveWise Tecnologia, OU=Mobile Engineering, O=DriveWise, L=Sao Paulo, ST=SP, C=BR"
          fi

      - name: Configurar permissões do Gradle e Android SDK
        run: |
          chmod +x android/gradlew
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Compilar APK Release Assinado com Gradle
        working-directory: ./android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Preparar arquivo drivewise.apk
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/drivewise.apk
          cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/app-debug.apk

      - name: Salvar APK como Artefato no GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: drivewise-apk
          path: |
            android/app/build/outputs/apk/release/drivewise.apk
            android/app/build/outputs/apk/release/app-debug.apk
          retention-days: 30

      - name: Publicar ou Atualizar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: DriveWise Copiloto Android Oficial (.apk)
          body: |
            ## 📱 DriveWise Copiloto Nativo Android (.apk) — Release v2.5.0
            Instalador oficial Release assinado (V1 + V2) com ícone oficial DriveWise e permissões compatíveis com Play Protect.
            - Toque em **drivewise.apk** para baixar e instalar no celular.
            - Caso o Android exiba o aviso padrão de download direto, toque em **Mais detalhes** → **Instalar assim mesmo**.
          files: |
            android/app/build/outputs/apk/release/drivewise.apk
            android/app/build/outputs/apk/release/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
