name: Build Android APK (DriveWise)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Gerar APK Nativo Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: |
          npm install --legacy-peer-deps
          npm install react-is --save

      - name: Compilar aplicação Web (Vite)
        run: npm run build

      - name: Sincronizar projeto Android com Capacitor
        run: npx cap sync android

      - name: Configurar permissões do Gradle e Android SDK
        run: |
          chmod +x android/gradlew
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Compilar APK Debug com Gradle
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Preparar arquivo drivewise.apk
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/drivewise.apk

      - name: Salvar APK como Artefato no GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: drivewise-apk
          path: |
            android/app/build/outputs/apk/debug/drivewise.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publicar ou Atualizar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: DriveWise Copiloto Android Oficial (.apk)
          body: |
            ## 📱 DriveWise Copiloto Nativo Android (.apk)
            Instalador oficial compilado automaticamente pelo GitHub Actions.
            - Toque em **drivewise.apk** para baixar e instalar no celular.
          files: |
            android/app/build/outputs/apk/debug/drivewise.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
