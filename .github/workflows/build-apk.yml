name: Build Android APK (DriveWise)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Gerar APK Nativo Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: |
          npm install --legacy-peer-deps
          npm install react-is --save

      - name: Compilar aplicação Web (Vite)
        run: npm run build

      - name: Sincronizar projeto Android com Capacitor
        run: npx cap sync android

      - name: Configurar permissões do Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK Debug com Gradle
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Salvar APK como Artefato no GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: drivewise-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publicar Release com o APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: DriveWise Copiloto ${{ github.ref_name }}
          body: |
            ## DriveWise Copiloto Nativo Android (.apk)
            Versão oficial completa com suporte à sobreposição flutuante e telemetria.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
